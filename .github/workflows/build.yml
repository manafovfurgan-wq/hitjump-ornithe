name: Build HitJump Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod jar
        run: ./gradlew build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: hitjump-1.8.9-ornithe-jar
          path: build/libs/*.jar
          exclude: build/libs/*-sources.jar
